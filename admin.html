<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrador | VerificaPrecios</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar"></header>
  <main>
    <section class="card">
      <h2>Módulo de administrador</h2>
      <p class="hint">Todos los productos registrados. Puedes modificar sus valores o eliminarlos.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Foto</th><th>Código</th><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
          </thead>
          <tbody id="admin-body"></tbody>
        </table>
      </div>
      <p id="admin-empty" class="hint" hidden>No hay artículos registrados.</p>
      <p id="msg" class="msg" role="alert"></p>
    </section>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <h2 id="edit-title">Editar artículo</h2>
    <form id="form-edit"></form>
    <p id="edit-msg" class="msg" role="alert"></p>
  </dialog>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
