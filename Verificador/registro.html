<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de usuario | VerificaPrecios</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
  <header id="topbar"></header>
  <main>
    <section class="card medium">
      <h2>Registro de usuario</h2>
      <form id="form-signup" class="form-grid">
        <label>Nombre de usuario
          <input type="text" name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]{3,20}"
                 title="De 3 a 20 caracteres: letras, números, guion bajo o punto." autocomplete="username">
        </label>
        <label>Nombre(s)
          <input type="text" name="nombres" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]{2,50}"
                 title="Solo letras y espacios (mínimo 2)." autocomplete="given-name">
        </label>
        <label>Apellido paterno
          <input type="text" name="apellidoPaterno" required minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]{2,40}"
                 title="Solo letras y espacios (mínimo 2)." autocomplete="family-name">
        </label>
        <label>Apellido materno
          <input type="text" name="apellidoMaterno" required minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]{2,40}"
                 title="Solo letras y espacios (mínimo 2).">
        </label>
        <label>Fecha de nacimiento
          <input type="date" name="fechaNacimiento" id="fecha" required min="1900-01-01" data-validate="birthdate" autocomplete="bday">
        </label>
        <label>Correo electrónico
          <input type="email" name="email" required maxlength="80" autocomplete="email">
        </label>
        <label>Puesto de trabajo
          <input type="text" name="puesto" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 .,\-]{2,50}"
                 title="De 2 a 50 caracteres: letras, números, espacios, punto, coma o guion.">
        </label>
        <label>Contraseña (mín. 8 caracteres)
          <input type="password" name="password" required minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,64}"
                 title="De 8 a 64 caracteres, con al menos una letra y un número." autocomplete="new-password">
        </label>
        <label>Confirmar contraseña
          <input type="password" name="passwordConfirm" required maxlength="64" data-match="password" autocomplete="new-password">
        </label>
        <div class="full">
          <button type="submit">Registrarme</button>
          <p id="msg" class="msg" role="alert"></p>
          <p class="hint">¿Ya tienes usuario? <a href="index.html">Inicia sesión</a></p>
        </div>
      </form>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="registro.js"></script>
</body>
</html>
